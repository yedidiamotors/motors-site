name: סנכרון מלאי מגוגל שיטס

on:
  schedule:
    # כל 30 דקות. GitHub עשוי לאחר בכמה דקות בשעות עומס.
    - cron: '*/30 * * * *'
  workflow_dispatch:        # הרצה ידנית מלשונית Actions
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/sync-inventory.yml'

permissions:
  contents: write

concurrency:
  group: sync-inventory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ווידוא ImageMagick (המרת התמונות)
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick libmagickcore-6.q16-6-extra
          fi
          convert -version | head -1

      - name: משיכת הגיליון, המרת תמונות, בניית inventory.json ועמודי ה-SEO
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: node scripts/sync-inventory.mjs

      - name: קיבוע השינוי
        run: |
          PATHS="data/inventory.json data/site-images.json assets sitemap.xml llms.txt stock"
          if [[ -z "$(git status --porcelain -- $PATHS)" ]]; then
            echo "אין שינוי לקבע."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $PATHS
          git commit -m "עדכון מלאי, תמונות ועמודי רכב"
          git push
