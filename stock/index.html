<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המלאי שלנו | ידידיה מוטורס</title>
<meta name="description" content="מלאי הרכבים של ידידיה מוטורס — רכבי יוקרה ושטח, חדשים ויד שנייה, קרית אתא.">
<link rel="canonical" href="https://motors.yedidia.co.il/stock/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --bg-2:#141416; --bg-3:#1b1b1e;
    --line:#2a2a2e; --line-2:#3a3a40;
    --fg:#f5f5f3; --muted:#a1a1aa; --muted-2:#71717a;
    --gold:#c9a227; --gold-hi:#ddb838; --gold-soft:rgba(201,162,39,.12);
    --ok:#4ade80; --transit:#60a5fa; --sold:#a1a1aa;
    --max:1240px; --radius:12px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
  img{max-width:100%;display:block}

  header{border-bottom:1px solid var(--line);background:var(--bg)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
  .brand{text-decoration:none;display:flex;flex-direction:column;line-height:1.05}
  .brand b{font-size:19px;font-weight:900;letter-spacing:.02em}
  .brand small{color:var(--gold);font-size:10px;letter-spacing:.28em;font-weight:500}
  .back{text-decoration:none;color:var(--muted);font-size:15px}
  .back:hover{color:var(--fg)}

  .head{padding:40px 0 26px}
  h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px);font-weight:900;letter-spacing:-.03em}
  .stamp{color:var(--muted-2);font-size:13px;font-weight:300}

  /* filters */
  .filters{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:16px 0 26px;border-bottom:1px solid var(--line);
  }
  .filters select,.filters input{
    font-family:inherit;font-size:15px;color:var(--fg);
    background:var(--bg-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;min-width:150px;
  }
  .filters input{flex:1;min-width:200px}
  .filters select:focus,.filters input:focus{outline:none;border-color:var(--gold)}
  .count{margin-inline-start:auto;color:var(--muted);font-size:14px;white-space:nowrap}

  /* grid */
  .grid{
    display:grid;gap:22px;padding:30px 0 60px;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  }
  .card{
    background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;transition:.18s;
  }
  .card:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .shot{
    position:relative;aspect-ratio:4/3;background:var(--bg-3);
    cursor:zoom-in;overflow:hidden;
  }
  .shot img{width:100%;height:100%;object-fit:cover;transition:.35s}
  .card:hover .shot img{transform:scale(1.04)}
  .shot .none{
    display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--muted-2);font-size:14px;font-weight:300;cursor:default;
  }
  .pill{
    position:absolute;top:12px;inset-inline-start:12px;
    font-size:12px;font-weight:500;padding:4px 11px;border-radius:999px;
    background:rgba(11,11,12,.82);backdrop-filter:blur(4px);border:1px solid var(--line-2);
  }
  .pill.available{color:var(--ok)}
  .pill.in_transit{color:var(--transit)}
  .pill.sold{color:var(--sold)}
  .shots-n{
    position:absolute;bottom:12px;inset-inline-end:12px;
    font-size:12px;padding:3px 9px;border-radius:6px;color:var(--fg);
    background:rgba(11,11,12,.75);backdrop-filter:blur(4px);
  }

  .body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
  .title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0}
  .title span{color:var(--muted);font-weight:400}
  .specs{display:flex;flex-wrap:wrap;gap:6px}
  .spec{
    font-size:13px;color:var(--muted);background:var(--bg-3);
    border:1px solid var(--line);border-radius:6px;padding:2px 9px;
  }
  .desc{margin:0;font-size:14px;color:var(--muted);font-weight:300;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .price{
    margin-top:auto;padding-top:12px;border-top:1px solid var(--line);
    font-size:20px;font-weight:700;color:var(--gold);
  }
  .price small{font-size:13px;color:var(--muted-2);font-weight:300}

  .state{padding:70px 20px;text-align:center;color:var(--muted);font-weight:300}
  .state b{display:block;color:var(--fg);font-weight:500;font-size:17px;margin-bottom:6px}

  /* lightbox */
  dialog{
    border:none;padding:0;background:transparent;max-width:100vw;max-height:100vh;
    width:100%;height:100%;margin:0;
  }
  dialog::backdrop{background:rgba(6,6,7,.94)}
  .lb{display:flex;flex-direction:column;height:100%;padding:16px;gap:12px}
  .lb-top{display:flex;justify-content:space-between;align-items:center;color:var(--fg);gap:12px}
  .lb-top strong{font-size:16px;font-weight:500}
  .lb-close{
    background:none;border:1px solid var(--line-2);color:var(--fg);
    border-radius:8px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:15px;
  }
  .lb-close:hover{border-color:var(--gold)}
  .lb-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;gap:10px}
  .lb-stage img{max-height:100%;max-width:100%;object-fit:contain;border-radius:8px}
  .nav{
    background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:var(--fg);
    width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:20px;flex:none;
  }
  .nav:hover{background:rgba(255,255,255,.12)}
  .lb-foot{text-align:center;color:var(--muted);font-size:14px}

  footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted-2);font-size:14px}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="/"><b>ידידיה מוטורס</b><small>YEDIDIA MOTORS</small></a>
    <a class="back" href="/">← חזרה לאתר</a>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1>המלאי שלנו</h1>
    <div class="stamp" id="stamp"></div>
  </div>

  <div class="filters" id="filters" hidden>
    <select id="f-make"><option value="">כל היצרנים</option></select>
    <select id="f-status">
      <option value="">כל הסטטוסים</option>
      <option value="available">זמין</option>
      <option value="in_transit">בדרך</option>
      <option value="sold">נמכר</option>
    </select>
    <select id="f-sort">
      <option value="new">החדשים ביותר</option>
      <option value="price-asc">מחיר: מהנמוך לגבוה</option>
      <option value="price-desc">מחיר: מהגבוה לנמוך</option>
      <option value="year-desc">שנתון: חדש לישן</option>
    </select>
    <input id="f-q" type="search" placeholder="חיפוש חופשי — דגם, צבע, אביזר…">
    <span class="count" id="count"></span>
  </div>

  <div id="out"><div class="state">טוען מלאי…</div></div>
</main>

<footer>
  <div class="wrap">המלאי מתעדכן אוטומטית. לפרטים ותיאום נסיעת מבחן — <a href="/#contact">צרו קשר</a>.</div>
</footer>

<dialog id="lb">
  <div class="lb">
    <div class="lb-top">
      <strong id="lb-title"></strong>
      <button class="lb-close" id="lb-close">סגירה ✕</button>
    </div>
    <div class="lb-stage">
      <button class="nav" id="lb-prev" aria-label="הקודם">›</button>
      <img id="lb-img" alt="">
      <button class="nav" id="lb-next" aria-label="הבא">‹</button>
    </div>
    <div class="lb-foot" id="lb-foot"></div>
  </div>
</dialog>

<script>
const STATUS_HE = { available:'זמין', in_transit:'בדרך', sold:'נמכר' };
const out = document.getElementById('out');
const filters = document.getElementById('filters');
let ALL = [];

const nis = n => new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(n);
const num = n => new Intl.NumberFormat('he-IL').format(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function card(v, i){
  const specs = [
    v.year, v.trim, v.color,
    v.km != null ? num(v.km)+' ק״מ' : null,
    v.engine, v.drivetrain, v.condition,
  ].filter(Boolean);

  const shot = v.images.length
    ? `<img src="${esc(v.images[0])}" alt="${esc(v.make+' '+v.model)}" loading="lazy">
       ${v.images.length>1 ? `<span class="shots-n">${v.images.length} תמונות</span>` : ''}`
    : `<div class="none">אין תמונה</div>`;

  return `
  <article class="card">
    <div class="shot" ${v.images.length ? `data-i="${i}"` : ''}>
      ${shot}
      <span class="pill ${v.status}">${STATUS_HE[v.status] || ''}</span>
    </div>
    <div class="body">
      <h2 class="title">${esc(v.make)} <span>${esc(v.model)}</span></h2>
      ${specs.length ? `<div class="specs">${specs.map(s=>`<span class="spec">${esc(s)}</span>`).join('')}</div>` : ''}
      ${v.description ? `<p class="desc">${esc(v.description)}</p>` : ''}
      <div class="price">${v.price != null ? nis(v.price) : 'לפרטים — צרו קשר'}${
        v.price != null && v.status==='available' ? ' <small>כולל מע״מ</small>' : ''}</div>
    </div>
  </article>`;
}

let VIEW = [];
function render(){
  const make = document.getElementById('f-make').value;
  const status = document.getElementById('f-status').value;
  const sort = document.getElementById('f-sort').value;
  const q = document.getElementById('f-q').value.trim().toLowerCase();

  VIEW = ALL.filter(v => {
    if (make && v.make !== make) return false;
    if (status && v.status !== status) return false;
    if (q){
      const hay = [v.make,v.model,v.trim,v.color,v.engine,v.drivetrain,v.description,...(v.features||[])]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const by = {
    'price-asc':  (a,b)=>(a.price??Infinity)-(b.price??Infinity),
    'price-desc': (a,b)=>(b.price??-Infinity)-(a.price??-Infinity),
    'year-desc':  (a,b)=>(b.year??0)-(a.year??0),
    'new':        (a,b)=>(a.status==='sold')-(b.status==='sold'),
  }[sort];
  VIEW.sort(by);

  document.getElementById('count').textContent = `${VIEW.length} מתוך ${ALL.length} רכבים`;

  out.innerHTML = VIEW.length
    ? `<div class="grid">${VIEW.map(card).join('')}</div>`
    : `<div class="state"><b>לא נמצאו רכבים</b>נסו לשנות את הסינון.</div>`;
}

/* lightbox */
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lb-img');
let gal = [], gi = 0;

function show(){
  lbImg.src = gal[gi];
  document.getElementById('lb-foot').textContent = `${gi+1} / ${gal.length}`;
}
out.addEventListener('click', e => {
  const shot = e.target.closest('.shot[data-i]');
  if (!shot) return;
  const v = VIEW[Number(shot.dataset.i)];
  gal = v.images; gi = 0;
  document.getElementById('lb-title').textContent = [v.make,v.model,v.year].filter(Boolean).join(' ');
  const multi = gal.length > 1;
  document.getElementById('lb-prev').hidden = !multi;
  document.getElementById('lb-next').hidden = !multi;
  show(); lb.showModal();
});
document.getElementById('lb-close').onclick = () => lb.close();
document.getElementById('lb-next').onclick = () => { gi = (gi+1)%gal.length; show(); };
document.getElementById('lb-prev').onclick = () => { gi = (gi-1+gal.length)%gal.length; show(); };
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
document.addEventListener('keydown', e => {
  if (!lb.open || gal.length < 2) return;
  if (e.key === 'ArrowLeft')  { gi = (gi+1)%gal.length; show(); }
  if (e.key === 'ArrowRight') { gi = (gi-1+gal.length)%gal.length; show(); }
});

/* load */
fetch('../data/inventory.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    ALL = d.vehicles || [];
    if (!ALL.length){
      out.innerHTML = `<div class="state"><b>המלאי מתעדכן</b>אין כרגע רכבים מסומנים להצגה. צרו קשר ונשמח לעדכן במה שמגיע.</div>`;
      return;
    }
    filters.hidden = false;
    const sel = document.getElementById('f-make');
    [...new Set(ALL.map(v => v.make))].sort().forEach(m => {
      const o = document.createElement('option'); o.value = o.textContent = m; sel.appendChild(o);
    });
    if (d.updated_at){
      document.getElementById('stamp').textContent =
        'עודכן ' + new Date(d.updated_at).toLocaleString('he-IL',{dateStyle:'long',timeStyle:'short'});
    }
    filters.addEventListener('input', render);
    render();
  })
  .catch(() => {
    out.innerHTML = `<div class="state"><b>לא הצלחנו לטעון את המלאי</b>נסו לרענן, או <a href="/#contact">צרו קשר</a>.</div>`;
  });
</script>
</body>
</html>
