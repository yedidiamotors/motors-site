name: סנכרון מלאי מגוגל שיטס

on:
  schedule:
    # כל 30 דקות. GitHub עשוי לאחר בכמה דקות בשעות עומס.
    - cron: '*/30 * * * *'
  workflow_dispatch:        # הרצה ידנית מלשונית Actions
  push:
    branches: [main]
    paths:
      - 'scripts/sync-inventory.mjs'
      - '.github/workflows/sync-inventory.yml'

permissions:
  contents: write

concurrency:
  group: sync-inventory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: משיכת הגיליון ובניית inventory.json
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: node scripts/sync-inventory.mjs

      - name: קיבוע השינוי
        run: |
          if [[ -z "$(git status --porcelain data/inventory.json)" ]]; then
            echo "אין שינוי לקבע."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inventory.json
          git commit -m "עדכון מלאי אוטומטי מגוגל שיטס"
          git push
